# What BizOS claims to be true, and how to find out cheaply.
#
# Run: python3 tools/claimcheck/claimcheck.py
#
# The bar for a claim is "this breaks SILENTLY": nothing errors, the demo still
# runs, and the promise is quietly false. A new project has no history yet, so
# the claims below guard the failures the design itself names (v1.2) and the
# ones a public repo always risks. Add one when something breaks silently today;
# falsify it once (break the thing, watch the claim fail) before trusting it.
#
# KEEP THE PROOFS CHEAP. No running server, no API key, no network. Grep the
# tree. `needs` marks a claim unchecked, not failed, when what it inspects does
# not exist yet - early in the day most of the rules claims will say so.

# ─────────────────────────────────────────────────────────── secrets and data

[repo: no Anthropic API key is committed]
why   = This repository is public and git history is forever. A key pasted into
        a test, a fixture or a "temporary" config is published the moment it is
        pushed, and the event credits behind it are spent by strangers. Removing
        it in a later commit does not unpublish it: the key must be revoked.
prove = ! git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}' -- .
tag   = secrets

[repo: no other credentials are committed]
why   = The same rule for every other shape a token takes: bearer headers and
        api_key assignments in code, tests or docs.
prove = ! git grep -nE '(Bearer [A-Za-z0-9_]{12,}|api[_-]?key["'\'' ]*[:=]["'\'' ]*[A-Za-z0-9]{16,})' -- .
tag   = secrets

[repo: .env is never tracked]
why   = .env holds the real key. It is gitignored, but `git add -f`, a renamed
        ignore rule or a teammate's editor can still stage it, and nothing
        complains until the key is public.
prove = test -z "$(git ls-files | grep -E '(^|/)[.]env$')"
tag   = secrets

[repo: the database is never tracked]
why   = The SQLite file holds every customer message, draft and audit entry. A
        committed demo database publishes whatever was typed into it today,
        including anything real a teammate tested with.
prove = test -z "$(git ls-files | grep -E '[.](db|sqlite|sqlite3)(-wal|-shm)?$')"
tag   = secrets

[repo: .gitignore keeps the key and the data out]
why   = The two claims above catch a leak after it is staged; this one keeps
        the guard rail itself from being edited away.
prove = grep -qxE '[.]env' .gitignore && grep -qE '[.](db|sqlite)' .gitignore
tag   = secrets

# ──────────────────────────────────────────────────────── one source of policy

[rules: there is no second source for gate limits]
why   = The v1.2 core fix. If the Policy Gate read its limits from a config
        file while the agent read the rules file, an owner editing the Markdown
        would change what the model says and not what the code enforces - two
        decision loops, and the demo's central promise false while every screen
        looks right. Limits live only in each rules file's policy: block.
prove = test -z "$(git ls-files | grep -iE '(^|/)gate[._-]?(config|limits)[.](json|ya?ml|ini|toml)$')"
tag   = rules

[agents: the model-facing code cannot send or approve anything]
why   = The models read untrusted customer text. If agent code could reach the
        outbox, an approval or the send loop, a prompt injection would only need
        to talk its way to one function call; every demo would still pass
        because no test message tries. The agents may only PROPOSE, through
        createDraft, where the gate and the owner's approval decide.
# Imports and calls, not words: a comment saying "createDraft decides" is fine.
prove = ! grep -rnE "from \"\.\./outbox\.ts\"|import [^;]*\b(decide|enqueue|listApprovals)\b|\b(dispatchOutbox|startOutboxLoop|decide)\(" server/src/agents
needs = test -d server/src/agents
tag   = gate

[gate: no limit is written in the gate's code]
why   = Every threshold must come from a policy: block. A "temporary" fallback
        cap or a default limit typed into gate.ts is a second source of policy:
        the owner edits the file, the model follows it, and the gate quietly
        keeps enforcing the number in the code. Four-digit literals are cents
        amounts ($10.00 and up); the gate has no other reason to hold one.
prove = ! grep -nE '[0-9]{4,}' server/src/gate.ts
needs = test -f server/src/gate.ts
tag   = rules

[rules: every starter template declares a policy block]
why   = A rules file without a policy: block still loads, still answers, and
        the gate silently has nothing to enforce for that department. The
        refund cap would exist only as prose the model is free to ignore.
        Unchecked until the first rules file lands in templates/ - the
        folder exists from the start with only a README in it.
prove = for f in $(git ls-files 'templates/*.rules.md'); do
        grep -q '^policy:' "$f" || { echo "no policy block: $f"; exit 1; }; done
needs = test -n "$(git ls-files 'templates/*.rules.md')"
tag   = rules

# ─────────────────────────────────────────────────────────────── the install

[install: npm start is defined]
why   = The whole submission is "git clone, npm install, npm start". A refactor
        that renames or drops the start script leaves every teammate's running
        server working and the fresh clone dead.
prove = grep -qE '"start"[[:space:]]*:' package.json
needs = test -f package.json
tag   = install

[install: the README carries the quickstart]
why   = Judges and small businesses follow the README, not the code. A README
        rewrite for the pitch that drops the commands reads beautifully and
        installs nothing.
prove = grep -q 'npm install' README.md && grep -q 'npm start' README.md
needs = test -f README.md
tag   = install

[repo: the license is MIT]
why   = The event's promise is that every project is open source for small
        businesses to use. A missing or swapped LICENSE quietly makes the repo
        all-rights-reserved.
prove = grep -q 'MIT License' LICENSE
tag   = repo

# ────────────────────────────────── candidates: write once the code exists
#
# Each of these is a v1.2 invariant that fails silently. Fill in `prove` with
# the real path once the file exists, falsify it, then uncomment.
#
# [gate: agents never hold a send or payment tool]
# why   = v1.2: only the gate's narrow API sends. An agent importing the outbox
#         or a mail client directly bypasses the gate, and every demo still
#         passes because the demo never asks for a blocked action through it.
# prove = ! grep -rnE "outbox|sendMail|send\(" server/src/agents
#
# [gate: the recipient never comes from model output]
# why   = v1.2: the reply goes to the verified channel record. A draft whose
#         "to" is read from the model can be talked into mailing anyone.
# prove = (grep the send path for the field it reads the address from)

[server: listens on localhost only by default]
why   = The MVP has no sign-in for rule edits. Bound to 0.0.0.0 on event
        Wi-Fi, anyone in the room can rewrite the refund cap - and nothing
        looks different on the presenter's screen. HOST in .env can still
        open it up deliberately; the DEFAULT must be closed.
prove = grep -qF 'host: env.HOST || "127.0.0.1"' server/src/config.ts
tag   = server
